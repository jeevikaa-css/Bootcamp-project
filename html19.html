<!DOCTYPE html>
<html>
<head>
    <title>Child Selector</title>

    <style>
        div > p {
            color: green;
        }
    </style>
</head>

<body>

    <div>
        <p>This is a direct child.</p>

        <section>
            <p>This is not a direct child.</p>
        </section>
    </div>

</body>
</html>
