<!DOCTYPE html>
<html>
<head>
    <title>Paragraph Color</title>

    <style>
        .blue {
            color: blue;
        }
    </style>
</head>

<body>

    <p class="blue">This is the first paragraph.</p>

    <p class="blue">This is the second paragraph.</p>

    <p>This is the third paragraph.</p>

</body>
</html>
