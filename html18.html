<!DOCTYPE html>
<html>
<head>
    <title>Descendant Selector</title>

    <style>
        div p {
            color: blue;
        }
    </style>
</head>

<body>

    <div>
        <p>This paragraph is inside div.</p>
        <p>This is also inside div.</p>
    </div>

    <p>This paragraph is outside div.</p>

</body>
</html>
