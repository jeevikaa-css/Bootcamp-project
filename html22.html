<!DOCTYPE html>
<html>
<head>
    <title>First Child</title>

    <style>
        p:first-child {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <p>This is the first paragraph.</p>
    <p>This is the second paragraph.</p>
    <p>This is the third paragraph.</p>

</body>
</html>
