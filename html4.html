<!DOCTYPE html>
<html>
<head>
    <title>CSS</title>

    <style>
        p {
            font-size: 16px;
        }

        .box {
            border: 1px solid black;
        }

        #title {
            color: blue;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h2 id="title">CSS</h2>

    <p>This is a normal paragraph.</p>

    <div class="box">
        This is a box.
    </div>

    <p class="highlight">This paragraph is highlighted.</p>

</body>
</html>
